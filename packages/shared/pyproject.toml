[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdgpu-shared"
version = "0.1.0"
description = "CrowdGPU shared contracts — cross-application types and schemas"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]

[tool.ruff]
line-length = 100
target-version = "py311"
