# CrowdGPU Coturn / TURN Server — Development Configuration Template
#
# Used by the coturn container in docker-compose.yml.
# Replace placeholder values with real configuration before deploying.
# NEVER commit credentials to source control.
#
# Reference: https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
# Listening port for STUN/TURN (UDP + TCP)
listening-port=3478

# TLS listening port (TCP)
tls-listening-port=5349

# External IP of the TURN server.
# In development, the container resolves this automatically.
# In production, set to the public IP or hostname of the TURN server.
# external-ip=YOUR_PUBLIC_IP

# ---------------------------------------------------------------------------
# Realm
# ---------------------------------------------------------------------------
realm=crowdgpu.local

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Use the HMAC-based time-limited credential mechanism.
# The secret is shared between the coordinator and the TURN server.
# In production, read from a secrets manager — never hardcode.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log-file=stdout
verbose

# ---------------------------------------------------------------------------
# Protocol
# ---------------------------------------------------------------------------
# Allow both UDP and TCP relay
no-tlsv1
no-tlsv1_1

# ---------------------------------------------------------------------------
# Quota / limits (development defaults — loosen as needed)
# ---------------------------------------------------------------------------
total-quota=100
bps-capacity=0
stale-nonce=600

# ---------------------------------------------------------------------------
# Fingerprint
# ---------------------------------------------------------------------------
fingerprint
