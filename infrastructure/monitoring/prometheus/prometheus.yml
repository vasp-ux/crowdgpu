global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting (placeholder — no alertmanager in bootstrap)
alerting:
  alertmanagers: []

# Rule files (none in bootstrap)
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # CrowdGPU Coordinator (uncomment when coordinator exposes /metrics)
  # - job_name: "crowdgpu-coordinator"
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]
  #   metrics_path: /metrics

  # CrowdGPU Worker (uncomment when worker exposes /metrics)
  # - job_name: "crowdgpu-worker"
  #   static_configs:
  #     - targets: ["host.docker.internal:9100"]
  #   metrics_path: /metrics
