# CrowdGPU Redis Development Configuration
# This file is used by the redis container in docker-compose.yml.
# Production configuration should be managed separately with appropriate
# security hardening.

# Persistence — Append-Only File for durability in development
appendonly yes
appendfsync everysec

# Memory limit for development (128MB)
maxmemory 128mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Bind to all interfaces inside the container
bind 0.0.0.0

# Disable protected mode (container network is isolated)
protected-mode no

# TCP keepalive
tcp-keepalive 300

# Slow log threshold (microseconds) — log queries slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128
